name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Set up Node (UI checks only; no npm packages)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI syntax
        run: node --check src/blindspot/web/assets/app.mjs

      - name: UI tests
        run: node --test tests/ui/state.test.mjs
